name: cloud-policy-crypto-access
services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_settings &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    volumes:
      - ./src:/app
      - /app/lib # Thêm dòng này để Docker sử dụng file .so bên trong image thay vì đọc từ Windows sang
      - ./docs:/docs
      - ./logs:/app/logs
      - ./config:/config:ro
      - ${CERTS_DIR:-./config/certs}:/certs:ro
      - ./scripts/gunicorn.conf.py:/app/gunicorn.conf.py:ro
      - static_volume:/app/staticfiles
      - ${DB_DIR:-sqlite_volume}:/app/data
      - ${KEYS_DIR:-keys_volume}:/app/config/keys
      - ./scripts/init_data.py:/app/init_data.py:ro
      - ./scripts/vault_manager.py:/app/vault_manager.py:ro
      - ./src/crypto_access/migrations:/app/crypto_access/migrations
      - vault_plugins:/vault/plugins:ro
    tmpfs:
      - /tmp

    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_URL=rediss://:${REDIS_PASSWORD:-strongpassword123}@redis_cache.cyberfortress.local:6379/1
      - REDIS_USE_TLS=True
      - REDIS_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - VAULT_ADDR=${VAULT_ADDR:-https://vault.cyberfortress.local:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - VAULT_SECRET_PATH=${VAULT_SECRET_PATH:-secret/data/crypto_access}
      - VAULT_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - PKI_SIGNER_URL=${PKI_SIGNER_URL:-https://pki_signer.cyberfortress.local:5000}
      - PKI_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - CLAMAV_HOST=clamav_tls_proxy
      - CLAMAV_PORT=3310
      - CLAMAV_USE_TLS=True
      - CLAMAV_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
    depends_on:
      - nginx
      - redis_cache
      - vault
      - clamav
      - clamav_tls_proxy
      # - db  # Uncomment if using postgres
    networks:
      - app-network
    restart: unless-stopped

  # Optional PostgreSQL Database
  # db:
  #   image: postgres:15-alpine
  #   container_name: postgres_db
  #   environment:
  #     - POSTGRES_USER=crypto_user
  #     - POSTGRES_PASSWORD=crypto_pass
  #     - POSTGRES_DB=crypto_db
  #   volumes:
  #     - postgres_volume:/var/lib/postgresql/data
  #   networks:
  #     - app-network
  #   restart: unless-stopped

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: vault_server
    ports:
      - "8200:8200"
    command: ["server", "-config=/vault/config/config.hcl"]
    environment:
      - VAULT_API_ADDR=https://127.0.0.1:8200
    volumes:
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file
      - ${CERTS_DIR:-./config/certs}:/vault/config/certs:ro
      - vault_plugins:/vault/plugins
    cap_add:
      - IPC_LOCK
    networks:
      app-network:
        aliases:
          - vault.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-strongpassword123}
      --tls-port 6379
      --port 0
      --tls-cert-file /certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt}
      --tls-key-file /certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key}
      --tls-ca-cert-file /certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      --tls-auth-clients no
    expose:
      - "6379"
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    networks:
      app-network:
        aliases:
          - redis_cache.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    # No ports exposed directly, only internal network
    expose:
      - "3310"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    networks:
      - app-network
    restart: unless-stopped

  clamav_tls_proxy:
    image: alpine/socat
    container_name: clamav_tls_proxy
    command: >
      OPENSSL-LISTEN:3310,cert=/certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt},key=/certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key},cafile=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt},verify=0,reuseaddr,fork
      TCP:clamav:3310
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    expose:
      - "3310"
    networks:
      app-network:
        aliases:
          - clamav_tls_proxy.${INTERNAL_DOMAIN:-cyberfortress.local}
    depends_on:
      - clamav
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_server
    profiles:
      - ssl
    volumes:
      - static_volume:/app/staticfiles
      - ${CERTS_DIR:-./config/certs}:/etc/nginx/certs:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-cloudsafe.cyberfortress.local}
      - PQC_SSL_CERT_FILE=${PQC_SSL_CERT_FILE:-_.pq-cyberfortress.local.crt}
      - PQC_SSL_KEY_FILE=${PQC_SSL_KEY_FILE:-_.pq-cyberfortress.local.key}
      - PQC_SSL_CA_FILE=${PQC_SSL_CA_FILE:-pq-CyberFortress-RootCA.crt}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - app-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run ${CLOUDFLARE_TUNNEL_ID}
    env_file:
      - .env
    volumes:
      - ./config/cloudflare:/etc/cloudflared:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - tunnel

  pki_signer:
    image: openquantumsafe/openssl3
    container_name: pki_signer
    user: root
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    environment:
      - TLS_CERT=/certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt}
      - TLS_KEY=/certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key}
    command: |
      sh -c "apk add --no-cache python3 && python3 -c \"
      import http.server, socketserver, subprocess, ssl, os
      class Handler(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers['Content-Length'])
              payload = self.rfile.read(length)
              with open('/tmp/payload', 'wb') as f: f.write(payload)
              res = subprocess.run(['openssl', 'pkeyutl', '-sign', '-inkey', '/certs/pq-CyberFortress-RootCA.key', '-rawin', '-in', '/tmp/payload'], capture_output=True)
              if res.returncode == 0:
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(res.stdout)
              else:
                  self.send_response(500)
                  self.end_headers()
                  self.wfile.write(res.stderr)
      httpd = socketserver.TCPServer(('0.0.0.0', 5000), Handler)
      context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
      context.load_cert_chain(os.environ.get('TLS_CERT'), os.environ.get('TLS_KEY'))
      httpd.socket = context.wrap_socket(httpd.socket, server_side=True)
      httpd.serve_forever()
      \""
    networks:
      app-network:
        aliases:
          - pki_signer.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

volumes:
  static_volume:
  sqlite_volume:
  keys_volume:
  vault_data:
  vault_plugins:

networks:
  app-network:
    driver: bridge

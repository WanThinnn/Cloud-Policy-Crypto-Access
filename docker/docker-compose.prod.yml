name: cloud-policy-crypto-access
services:
  web:
    platform: linux/amd64
    image: wanthinnn/cloud-policy-crypto-access:pqc-latest
    container_name: crypto_web
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_URL=rediss://:${REDIS_PASSWORD:-strongpassword123}@crypto-redis.cyberfortress.local:6379/1
      - REDIS_USE_TLS=True
      - REDIS_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - VAULT_ADDR=${VAULT_ADDR:-https://vault.cyberfortress.local:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - VAULT_SECRET_PATH=${VAULT_SECRET_PATH:-secret/data/crypto_access}
      - VAULT_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - PKI_SIGNER_URL=${PKI_SIGNER_URL:-https://pki_signer.cyberfortress.local:5000}
      - PKI_AUTH_TOKEN=${PKI_AUTH_TOKEN:-pki-default-token}
      - PKI_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
      - CLAMAV_HOST=clamav_tls_proxy
      - CLAMAV_PORT=3310
      - CLAMAV_USE_TLS=True
      - CLAMAV_CACERT=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt}
    depends_on:
      - crypto-redis
      - vault
      - clamav
      - clamav_tls_proxy
    volumes:
      - ${DB_DIR:-sqlite_volume}:/app/data
      - ${KEYS_DIR:-keys_volume}:/app/config/keys
      - ./docs:/docs
      - ./logs:/app/logs
      - ./config:/config:ro
      - ${CERTS_DIR:-./config/certs}:/certs:ro
      - static_volume:/app/staticfiles
      - ./scripts/gunicorn.conf.py:/app/gunicorn.conf.py:ro
      - ./scripts/init_data.py:/app/init_data.py:ro
      - ./scripts/vault_manager.py:/app/vault_manager.py:ro
      - ./src/crypto_access/migrations:/app/crypto_access/migrations
      - vault_plugins:/vault/plugins:ro
    tmpfs:
      - /tmp
    expose:
      - "8000"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  crypto-redis:
    image: redis:7-alpine
    container_name: crypto_redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-strongpassword123} --tls-port 6379 --port 0 --tls-cert-file /certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt} --tls-key-file /certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key} --tls-ca-cert-file /certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt} --tls-auth-clients no
    expose:
      - "6379"
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    networks:
      app-network:
        aliases:
          - crypto-redis.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    # No ports exposed directly, only internal network
    expose:
      - "3310"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    networks:
      - app-network
    restart: unless-stopped

  clamav_tls_proxy:
    image: alpine/socat
    container_name: clamav_tls_proxy
    command: >
      OPENSSL-LISTEN:3310,cert=/certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt},key=/certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key},cafile=/certs/${ROOT_CA_FILENAME:-CyberFortress-RootCA.crt},verify=0,reuseaddr,fork TCP:clamav:3310
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    expose:
      - "3310"
    networks:
      app-network:
        aliases:
          - clamav_tls_proxy.${INTERNAL_DOMAIN:-cyberfortress.local}
    depends_on:
      - clamav
    restart: unless-stopped

  vault:
    image: wanthinnn/cloud-policy-vault:pqc-latest
    container_name: vault_server
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://127.0.0.1:8200
    volumes:
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file
      - ${CERTS_DIR:-./config/certs}:/vault/config/certs:ro
      - vault_plugins:/vault/plugins
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      app-network:
        aliases:
          - vault.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: crypto_nginx
    profiles:
      - ssl
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-80}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - ${CERTS_DIR:-./config/certs}:/etc/nginx/certs:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-cloudsafe.cyberfortress.local}
      - PQC_SSL_CERT_FILE=${PQC_SSL_CERT_FILE:-_.pq-cyberfortress.local.crt}
      - PQC_SSL_KEY_FILE=${PQC_SSL_KEY_FILE:-_.pq-cyberfortress.local.key}
      - PQC_SSL_CA_FILE=${PQC_SSL_CA_FILE:-pq-CyberFortress-RootCA.crt}
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run ${CLOUDFLARE_TUNNEL_ID}
    env_file:
      - .env
    volumes:
      - ./config/cloudflare:/etc/cloudflared:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - tunnel

  pki_signer:
    image: openquantumsafe/openssl3
    container_name: pki_signer
    user: root
    volumes:
      - ${CERTS_DIR:-./config/certs}:/certs:ro
    environment:
      - TLS_CERT=/certs/${TLS_CERT_FILENAME:-_.cyberfortress.local.crt}
      - TLS_KEY=/certs/${TLS_KEY_FILENAME:-_.cyberfortress.local.key}
      - PKI_AUTH_TOKEN=${PKI_AUTH_TOKEN:-pki-default-token}
    command: |
      sh -c "apk add --no-cache python3 && python3 -c \"
      import http.server, socketserver, subprocess, ssl, os
      class Handler(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              auth_header = self.headers.get('Authorization')
              expected_token = 'Bearer ' + os.environ.get('PKI_AUTH_TOKEN', 'pki-default-token')
              if auth_header != expected_token:
                  self.send_response(401)
                  self.end_headers()
                  self.wfile.write(b'Unauthorized')
                  return
              length = int(self.headers['Content-Length'])
              payload = self.rfile.read(length)
              with open('/tmp/payload', 'wb') as f: f.write(payload)
              res = subprocess.run(['openssl', 'pkeyutl', '-sign', '-inkey', '/certs/pq-CyberFortress-RootCA.key', '-rawin', '-in', '/tmp/payload'], capture_output=True)
              if res.returncode == 0:
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(res.stdout)
              else:
                  self.send_response(500)
                  self.end_headers()
                  self.wfile.write(res.stderr)
      httpd = socketserver.TCPServer(('0.0.0.0', 5000), Handler)
      context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
      context.load_cert_chain(os.environ.get('TLS_CERT'), os.environ.get('TLS_KEY'))
      httpd.socket = context.wrap_socket(httpd.socket, server_side=True)
      httpd.serve_forever()
      \""
    networks:
      app-network:
        aliases:
          - pki_signer.${INTERNAL_DOMAIN:-cyberfortress.local}
    restart: unless-stopped

  openvpn:
    build:
      context: ./docker/openvpn
      dockerfile: Dockerfile
    container_name: openvpn_server
    cap_add:
      - NET_ADMIN
      - MKNOD
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1194:1194/udp"
    volumes:
      - openvpn_data:/etc/openvpn
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - vpn
volumes:
  sqlite_volume:
    name: sqlite_volume
  static_volume:
    name: static_volume
  keys_volume:
    name: keys_volume
  vault_data:
    name: vault_data
  vault_plugins:
    name: vault_plugins
  openvpn_data:
    name: openvpn_data

networks:
  app-network:
    driver: bridge

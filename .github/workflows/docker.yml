name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Read Version from file
        id: get_version
        run: |
          VERSION_NUM=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION_NUM" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref_name }}" == "feature/cloud-policy-quantum-access" ]] || [[ "$VERSION_NUM" == 2.* ]]; then
            echo "alias=pqc-latest" >> $GITHUB_OUTPUT
          else
            echo "alias=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: wanthinnn
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Django App to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            wanthinnn/cloud-policy-quantum-access:${{ steps.get_version.outputs.version }}
            wanthinnn/cloud-policy-quantum-access:${{ steps.get_version.outputs.alias }}
          cache-from: type=gha,scope=django
          cache-to: type=gha,mode=max,scope=django

      - name: Build & Push Vault Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/vault/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            wanthinnn/cloud-policy-vault:${{ steps.get_version.outputs.version }}
            wanthinnn/cloud-policy-vault:${{ steps.get_version.outputs.alias }}
          cache-from: type=gha,scope=vault
          cache-to: type=gha,mode=max,scope=vault

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')   # ← Chỉ chạy khi push tag v*
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_note/release_${{ steps.get_version.outputs.version }}.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}